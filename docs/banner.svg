<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07040f"/>
      <stop offset="0.55" stop-color="#140a2b"/>
      <stop offset="1" stop-color="#05030b"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#e7dcff"/>
      <stop offset="0.6" stop-color="#9b7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6a4bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9b6ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff9ad5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7a5cff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .spin  { transform-origin: 230px 160px; animation: spin 14s linear infinite; }
    .spinr { transform-origin: 230px 160px; animation: spin 9s linear infinite reverse; }
    .spin2 { transform-origin: 230px 160px; animation: spin 22s linear infinite; }
    .pulse { transform-origin: 230px 160px; animation: pulse 2.4s ease-in-out infinite; }
    .scan  { animation: scan 4s linear infinite; }
    .blink { animation: blink 1.1s steps(2) infinite; }
    .fade1 { animation: fade 3s ease-in-out infinite; }
    .fade2 { animation: fade 3s ease-in-out 1s infinite; }
    .fade3 { animation: fade 3s ease-in-out 2s infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(0.92); opacity: .85 } 50% { transform: scale(1.06); opacity: 1 } }
    @keyframes scan  { from { transform: translateY(-20px) } to { transform: translateY(340px) } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes fade  { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#b79cff" opacity="0.18"/>

  <!-- corner brackets -->
  <g stroke="#9b7bff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M24 64V24H64"/><path d="M1136 24H1176V64"/>
    <path d="M24 256V296H64"/><path d="M1136 296H1176V256"/>
  </g>

  <!-- hologram orb -->
  <g filter="url(#glow)">
    <circle class="pulse" cx="230" cy="160" r="70" fill="url(#core)"/>
    <g class="spin" fill="none" stroke="#a98bff" stroke-width="2.5">
      <path d="M230 30a130 130 0 0 1 112 64" stroke-linecap="round"/>
      <path d="M352 200a130 130 0 0 1-60 70" stroke-linecap="round"/>
      <path d="M150 262a130 130 0 0 1-48-60" stroke-linecap="round"/>
      <path d="M104 110a130 130 0 0 1 40-55" stroke-linecap="round"/>
    </g>
    <g class="spinr" fill="none" stroke="#ff9ad5" stroke-width="1.6" stroke-opacity="0.8">
      <ellipse cx="230" cy="160" rx="112" ry="34" transform="rotate(-22 230 160)"/>
    </g>
    <g class="spin2" fill="none" stroke="#7fd6ff" stroke-width="1.4" stroke-opacity="0.7" stroke-dasharray="4 7">
      <circle cx="230" cy="160" r="100"/>
    </g>
    <g class="spinr">
      <circle cx="342" cy="160" r="5" fill="#fff"/>
      <circle cx="118" cy="160" r="3.5" fill="#ffd1ee"/>
    </g>
    <g class="spin">
      <circle cx="230" cy="58" r="4" fill="#cfe9ff"/>
    </g>
  </g>

  <!-- title -->
  <text x="420" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800"
        letter-spacing="6" fill="url(#title)" filter="url(#glow)">HINATA X HELPER</text>
  <text x="424" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cbbcff" letter-spacing="0.5">
    Your local AI assistant for Windows + Android, with a 3D hologram
  </text>

  <!-- terminal line -->
  <g font-family="Consolas, Menlo, monospace" font-size="17">
    <text x="424" y="222" fill="#7fd6ff">&gt;</text>
    <text x="444" y="222" fill="#e9e2ff">"Hinata, open VS Code and make a presentation on black holes"</text>
    <rect class="blink" x="1084" y="207" width="10" height="19" fill="#e9e2ff"/>
  </g>

  <!-- status chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="2">
    <g class="fade1"><rect x="424" y="248" width="150" height="28" rx="14" fill="#1d1240" stroke="#9b7bff"/>
      <text x="449" y="267" fill="#cbbcff">● LISTENING</text></g>
    <g class="fade2"><rect x="586" y="248" width="164" height="28" rx="14" fill="#1d1240" stroke="#7fd6ff"/>
      <text x="608" y="267" fill="#bfe8ff">● PROCESSING</text></g>
    <g class="fade3"><rect x="762" y="248" width="164" height="28" rx="14" fill="#1d1240" stroke="#ff9ad5"/>
      <text x="784" y="267" fill="#ffd1ee">● RESPONDING</text></g>
  </g>
</svg>
